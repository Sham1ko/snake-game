<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b08" />
    <title>Snake · Arcade Classic</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%23070b08'/%3E%3Crect%20x='2'%20y='2'%20width='9'%20height='9'%20rx='2'%20fill='%2357ff7f'/%3E%3Crect%20x='9'%20y='9'%20width='5'%20height='5'%20rx='1.5'%20fill='%23ffc857'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="state-menu">
    <div class="vignette" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <main class="stage">
      <header class="masthead">
        <p class="eyebrow">Retro arcade</p>
        <h1 class="logo">Snake</h1>
        <p class="tagline">Eat the food. Grow long. Avoid the walls.</p>
      </header>

      <section id="menu" class="menu" aria-label="Main menu">
        <div id="controlPicker" class="picker" aria-label="Control scheme">
          <span class="picker-label">Controls</span>
          <div class="picker-options" role="group">
            <button type="button" class="picker-opt" data-mode="swipe">Swipe</button>
            <button type="button" class="picker-opt" data-mode="buttons">Buttons</button>
          </div>
        </div>
        <button id="startButton" class="btn btn-primary">Start Game</button>
        <button id="leaderboardButton" class="btn btn-ghost">Leaderboard</button>
      </section>

      <section id="gameArea" class="game-area" aria-label="Game">
        <div id="hud" class="hud">
          <div id="hintChip" class="hud-chip">Arrows / WASD</div>
          <div class="hud-right">
            <div id="score" class="hud-chip score-chip">
              <span class="score-label">Score</span>
              <span id="scoreValue" class="score-value">0</span>
            </div>
            <button id="pauseButton" class="hud-btn" type="button" aria-label="Pause game">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1"/><rect x="9.4" y="2" width="3.6" height="12" rx="1"/></svg>
            </button>
          </div>
        </div>
        <div id="screenFrame" class="screen">
          <canvas id="gameCanvas" width="300" height="300"></canvas>
        </div>
        <div id="pad" class="pad" aria-label="Direction buttons">
          <button id="padUp" class="pad-btn" type="button" aria-label="Turn up">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg>
          </button>
          <button id="padLeft" class="pad-btn" type="button" aria-label="Turn left">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"/></svg>
          </button>
          <button id="padDown" class="pad-btn" type="button" aria-label="Turn down">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button id="padRight" class="pad-btn" type="button" aria-label="Turn right">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
          </button>
        </div>
      </section>
    </main>

    <!-- Креды: GitHub автора и репозиторий -->
    <footer class="credits">
      <span class="credits-label">Made by</span>
      <a class="credits-link" href="https://github.com/Sham1ko" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        Sham1ko
      </a>
      <span class="credits-dot" aria-hidden="true">·</span>
      <a class="credits-link" href="https://github.com/Sham1ko/snake-game" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        source
      </a>
    </footer>

    <!-- Окно окончания игры -->
    <div id="gameOverScreen" class="overlay" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="panel">
        <p class="overlay-eyebrow">Run finished</p>
        <h2 id="gameOverTitle">Game Over</h2>
        <p id="finalScore" class="final-score"></p>

        <!-- Сохранение результата -->
        <div class="save-block">
          <p class="save-label">Save this result?</p>
          <div class="save-row">
            <input type="text" id="playerName" placeholder="Your name" maxlength="24" autocomplete="off" />
            <button id="saveButton" class="btn btn-amber">Save</button>
          </div>
          <p id="saveStatus" class="save-status" role="status" aria-live="polite"></p>
        </div>

        <div class="overlay-actions">
          <button id="restartButton" class="btn btn-primary">Restart</button>
          <button id="menuButton" class="btn btn-ghost">Menu</button>
        </div>
      </div>
    </div>

    <!-- Пауза -->
    <div id="pauseScreen" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <div class="panel">
        <p class="overlay-eyebrow">Take a breath</p>
        <h2 id="pauseTitle">Paused</h2>
        <p id="pauseScore" class="final-score"></p>
        <div class="overlay-actions">
          <button id="resumeButton" class="btn btn-primary">Resume</button>
          <button id="pauseMenuButton" class="btn btn-ghost">Menu</button>
        </div>
      </div>
    </div>

    <!-- Модальное окно таблицы лидеров -->
    <div id="leaderboardModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle">
      <div class="panel">
        <div class="modal-head">
          <h2 id="leaderboardTitle">Leaderboard</h2>
          <button id="closeLeaderboardButton" class="icon-btn" aria-label="Close leaderboard">×</button>
        </div>
        <table id="leaderboardTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Date</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <!-- Строки добавляет ui.js -->
          </tbody>
        </table>
      </div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
